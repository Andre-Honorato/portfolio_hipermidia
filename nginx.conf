server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redireciona /pagina para /pagina/ sem expor host ou porta internos (o Coolify fica na frente).
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Arquivos do build com hash no nome: cache longo.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Capas, áudio e logos.
    location ~ ^/(midia|logos)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
